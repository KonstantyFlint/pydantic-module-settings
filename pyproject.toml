[project]
name = "pydantic-env-settings"
version = "0.1.0"
description = "Load module-level settings from environment variables, validated by pydantic."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/packages"]
