name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
      - run: uv run --locked invoke static_checks --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true
      - run: uv run --locked pytest --cov
